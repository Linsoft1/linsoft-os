[greeter]
background=/usr/share/backgrounds/linsoft/linsoft-blue.svg
user-background=false
theme-name=Linsoft-Blue
icon-theme-name=Linsoft-Icons
cursor-theme-name=Adwaita
logo=/usr/share/pixmaps/linsoft-logo.svg
font-name=DejaVu Sans 10
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
indicators=~clock;~language;~session;~power
clock-format=%A %e %B, %H:%M
default-user-image=/usr/share/icons/Linsoft-Icons/scalable/apps/distributor-logo-linsoft.svg
