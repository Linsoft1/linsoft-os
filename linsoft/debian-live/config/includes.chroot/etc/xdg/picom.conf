backend = "xrender";
vsync = true;
fading = true;
fade-delta = 8;
fade-in-step = 0.04;
fade-out-step = 0.04;
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.24;
shadow-offset-x = -2;
shadow-offset-y = 6;
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Conky'"
];
inactive-opacity = 0.98;
active-opacity = 1.0;
frame-opacity = 0.96;
detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
