conky.config = {
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 150,
    own_window_colour = '0b1628',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    alignment = 'top_right',
    gap_x = 36,
    gap_y = 44,
    minimum_width = 250,
    maximum_width = 250,
    update_interval = 2,
    use_xft = true,
    font = 'DejaVu Sans:size=10',
    default_color = 'b8c9df',
    color1 = '67c7ff',
    color2 = 'ffffff',
    draw_borders = false,
    draw_shades = false,
    border_inner_margin = 18,
    border_outer_margin = 0,
    override_utf8_locale = true,
}

conky.text = [[
${color2}${font DejaVu Sans:bold:size=34}${time %H:%M}${font}
${color1}${time %A}${color} · ${time %d. %B %Y}

${color1}CPU${color}  ${alignr}${cpu cpu0}%
${cpubar cpu0 5,214}
${color1}RAM${color}  ${alignr}${mem} / ${memmax}
${membar 5,214}
${color1}Disk${color}  ${alignr}${fs_used /} / ${fs_size /}
${fs_bar 5,214 /}

${color1}Sieť${color}  ${alignr}${downspeed} ↓  ${upspeed} ↑
]]
