set default=0
set timeout=10
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
search --no-floppy --set=root --file /linsoft/live/@ID@.id
set gfxmode=1280x720,1024x768,auto
set gfxpayload=keep
if [ "$lockdown" = y ]; then
    # Secure Boot: GRUB refuses to load fonts, use the text menu.
    terminal_output console serial
elif loadfont /boot/grub/themes/linsoft/linsoft.pf2; then
    terminal_output gfxterm serial
    set theme=/boot/grub/themes/linsoft/theme.txt
    export theme
else
    terminal_output console serial
fi

menuentry 'Linsoft OS Live - vyskusat bez instalacie' --id linsoft-live {
    linux /linsoft/boot/linsoft-kernel linsoft.live=1 linsoft.id=@ID@ console=ttyS0,115200n8 net.ifnames=0 quiet loglevel=0 logo.nologo vt.global_cursor_default=0 linsoft.splash=1
    initrd /linsoft/boot/initrd.img
}
menuentry 'Instalovat Linsoft OS na disk' --id linsoft-install {
    terminal_output console serial
    linux /linsoft/boot/linsoft-kernel linsoft.live=1 linsoft.id=@ID@ linsoft.installer=1 console=ttyS0,115200n8 console=tty1 net.ifnames=0 quiet loglevel=3
    initrd /linsoft/boot/initrd.img
}
menuentry 'Linsoft OS Live - nacitat do RAM (min. 8 GB)' --id linsoft-toram {
    linux /linsoft/boot/linsoft-kernel linsoft.live=1 linsoft.id=@ID@ linsoft.toram=1 console=ttyS0,115200n8 net.ifnames=0 quiet loglevel=0 logo.nologo vt.global_cursor_default=0 linsoft.splash=1
    initrd /linsoft/boot/initrd.img
}
menuentry 'Linsoft OS Live - diagnostika / konzola' --id linsoft-console {
    terminal_output console serial
    linux /linsoft/boot/linsoft-kernel linsoft.live=1 linsoft.id=@ID@ console=ttyS0,115200n8 console=tty1 net.ifnames=0 linsoft.console=1
    initrd /linsoft/boot/initrd.img
}
if [ "$grub_platform" = efi ]; then
    menuentry 'Nastavenia firmveru UEFI' --id linsoft-fwsetup {
        fwsetup
    }
fi
menuentry 'Restartovat' --id linsoft-reboot {
    reboot
}
menuentry 'Vypnut' --id linsoft-halt {
    halt
}
